name: Deploy to Azure App Service

# ポートフォリオ運用のため自動デプロイは無効化（Microsoftコンテスト終了後の課金回避）。
# Azure App Service を再稼働させたい場合のみ、GitHub の Actions 画面から手動実行する。
# 自動デプロイに戻すには下記を `push: { branches: [main] }` に変更すること。
on:
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        run: |
          zip -r app.zip . \
            -x "*.zip" ".git/*" ".env" \
            "__pycache__/*" "*.pyc" ".DS_Store"
          az webapp deploy \
            --name codebridge-ringi \
            --resource-group codebridge-rg \
            --src-path app.zip \
            --type zip
